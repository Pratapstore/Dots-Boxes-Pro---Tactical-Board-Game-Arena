name: Build Android APK for Amazon Appstore & Google Play

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Linux Environment & Install Dependencies
        run: |
          rm -f .npmrc
          npm install --legacy-peer-deps

      - name: Build Web Application Bundle
        run: npm run build

      - name: Sync Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          npx cap copy android || true

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Android APK with Gradle
        working-directory: ./android
        run: |
          ./gradlew :app:assembleDebug -x test -x lint --no-daemon --stacktrace

      - name: Prepare Named APK File
        run: |
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" ./Dots-and-Boxes-Pro-v1.0.apk
          ls -lh ./Dots-and-Boxes-Pro-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dots-and-Boxes-Pro-APK
          path: Dots-and-Boxes-Pro-v1.0.apk

      - name: Publish Direct Download APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Dots & Boxes Pro v1.0.0 (Direct APK Download)"
          body: |
            ## 🎮 Dots & Boxes Pro — Official Android APK
            
            Download the official `.apk` file below and install it directly on your Android phone, tablet, Fire TV, or upload to Amazon Appstore!
            
            - **Package ID:** `com.dotsandboxes.pro`
            - **Version:** `1.0.0 (Build 1)`
            - **Compatibility:** Android 7.0+ (API 24 to 35) & Amazon Fire OS
          files: Dots-and-Boxes-Pro-v1.0.apk
