name: Build Android APK for Amazon Appstore & Google Play

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Linux Environment & Install Dependencies
        run: |
          rm -f .npmrc
          npm install --legacy-peer-deps

      - name: Build Web Application Bundle
        run: npm run build

      - name: Sync Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          npx cap copy android || true

      - name: Build Android APK with Gradle
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dots-and-boxes-pro-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
